<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E3F45"/>
      <stop offset="0.55" stop-color="#155F66"/>
      <stop offset="1" stop-color="#1F7F86"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#F3EEE3" stop-opacity="0.86"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <ellipse cx="512" cy="290" rx="330" ry="150" fill="#FFFFFF" opacity="0.06" filter="url(#soft)"/>
  <!-- two arcs that almost meet: thoughts closing into a whole -->
  <g fill="none" stroke="url(#ink)" stroke-linecap="round">
    <path d="M 700 330 A 250 250 0 1 0 700 694" stroke-width="78"/>
    <path d="M 612 412 A 130 130 0 1 0 612 612" stroke-width="54" opacity="0.92"/>
  </g>
  <circle cx="512" cy="512" r="44" fill="url(#ink)"/>
</svg>
